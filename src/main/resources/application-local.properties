spring.application.name=drive-service
server.port=8084

# Local PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/yuktisetu
spring.datasource.username=yuktisetu
spring.datasource.password=YuktiSetu!2026@
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# validate, not update: every service scans org.yuktisetu.db, so more than one
# service auto-creating the same tables concurrently is a race. admin-service is
# the single DDL owner and must be started first after any schema change.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Redis is used for exactly one thing here: the lock that stops two instances
# sealing the same drive. With the sweep disabled nothing in this service touches
# Redis, so its health indicator is switched off too -- otherwise /actuator/health
# reports DOWN on a service that can serve every endpoint, and a real deployment
# would refuse to route traffic to it. Turn the indicator back on wherever the
# sweep is enabled, because there Redis genuinely is required.
management.health.redis.enabled=false

# Local Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=YuktiSetu@2026
spring.data.redis.timeout=2000ms

yuktisetu.jwt.public-key-path=classpath:/keys/public.pem
yuktisetu.jwt.issuer=auth-service

# The deadline sweep. Off by default so a developer's laptop does not close live
# drives in the shared database; turn it on deliberately where it should run.
yuktisetu.drive.sealing.enabled=true
yuktisetu.drive.sealing.fixed-delay-ms=60000

# Kafka. A local broker runs via `brew services start kafka` (KRaft, no
# ZooKeeper). With this on, the outbox relay ships applicant-pool.sealed events.
# With it off, publishing a drive still queues its outbox row and eligibility
# resolution is triggered through the TnP's re-evaluate endpoint instead, so the
# whole flow stays exercisable without a broker.
yuktisetu.kafka.enabled=true
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=drive-service.eligibility
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# Referenced by OutboxRelay with a code default of 2000 but never defined here
# until now -- making the relay's cadence visible in config rather than implied.
yuktisetu.outbox.relay.fixed-delay-ms=2000

# ------------------------------------------------------------------
# Portal URLs. These end up as the clickable link in every notification --
# the "View drive" button in an email and the actionUrl on an in-app row --
# so they must be where a human can actually reach the app, not where the
# service happens to be listening.
#
# Student-facing notices link to the student portal, staff-facing ones to
# the admin portal. Both are dev-server ports here; on a real deployment
# these become the two public hostnames.
# ------------------------------------------------------------------
yuktisetu.portal.student-url=http://localhost:3001
yuktisetu.portal.admin-url=http://localhost:3000

# ------------------------------------------------------------------
# Scheduler threads. Spring's default pool is ONE thread, shared by every
# @Scheduled job in the service: the outbox relay (which blocks on each Kafka
# send), the deadline sweep and the scoring-gate reconciler. With one thread a
# slow relay pass would hold the deadline sweep back -- the starvation this
# setting exists to prevent. One thread per job.
spring.task.scheduling.pool.size=3

# ------------------------------------------------------------------
# Coding capture at apply. Only platforms the scraper has an adapter for are
# queued; anything else would fail and flag the student for review over a gap
# that is ours. give-up-minutes is the absolute limit on a scrape job (attempts
# at +0, +15 and +60 min, plus slack), and must match the scraper's schedule.
# CODECHEF removed 2026-10-28: its terms of service forbid automated access.
yuktisetu.coding.capture.platforms=LEETCODE,CODEFORCES
yuktisetu.coding.capture.give-up-minutes=70

# The scoring gate's safety net. Drives become ready by events, the moment the
# last condition settles; this pass only repairs a lost event or a change made
# where no hook exists yet. It reads open gates only, so it is near free.
yuktisetu.drive.scoring-gate.reconcile.enabled=true
yuktisetu.drive.scoring-gate.reconcile.fixed-delay-ms=300000
