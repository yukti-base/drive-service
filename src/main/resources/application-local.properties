spring.application.name=drive-service
server.port=8084

# Local PostgreSQL -- the same database every service shares.
spring.datasource.url=jdbc:postgresql://ep-sparkling-mouse-ayji4291-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_NGeLjF2YWKt1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# validate, not update: every service scans org.yuktisetu.db, so more than one
# service auto-creating the same tables concurrently is a race. admin-service is
# the single DDL owner and must be started first after any schema change.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Redis is used for exactly one thing here: the lock that stops two instances
# sealing the same drive. With the sweep disabled nothing in this service touches
# Redis, so its health indicator is switched off too -- otherwise /actuator/health
# reports DOWN on a service that can serve every endpoint, and a real deployment
# would refuse to route traffic to it. Turn the indicator back on wherever the
# sweep is enabled, because there Redis genuinely is required.
management.health.redis.enabled=false

# Local Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=YuktiSetu@2026
spring.data.redis.timeout=2000ms

yuktisetu.jwt.public-key-path=classpath:/keys/public.pem
yuktisetu.jwt.issuer=auth-service

# The deadline sweep. Off by default so a developer's laptop does not close live
# drives in the shared database; turn it on deliberately where it should run.
yuktisetu.drive.sealing.enabled=false
yuktisetu.drive.sealing.fixed-delay-ms=60000

# Kafka. Disabled locally because no broker runs yet (docker-compose has only
# Postgres and Redis). While it is off, publishing a drive still queues its
# outbox row, and eligibility resolution is triggered through the TnP's
# re-evaluate endpoint instead of the consumer -- so the whole flow is exercisable
# without a broker.
yuktisetu.kafka.enabled=false
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=drive-service.eligibility
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
