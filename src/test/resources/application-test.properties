# Integration-test profile.
#
# Points at a THROWAWAY database (yuktisetu_test) with ddl-auto=create-drop, so
# tests build their own schema from the entities and tear it down afterwards.
# Nothing here ever touches yuktisetu, yuktisetu_drive or Neon -- a test run must
# not leave rows in a database anyone is working in.
spring.application.name=drive-service-test
server.port=0

spring.datasource.url=jdbc:postgresql://localhost:5432/yuktisetu_test
spring.datasource.username=yuktisetu
spring.datasource.password=YuktiSetu!2026@
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# The apply/seal race is the whole point of these tests, so the lock timeout must
# be short enough that a genuine deadlock fails fast instead of hanging the build.
spring.jpa.properties.jakarta.persistence.lock.timeout=5000

yuktisetu.jwt.public-key-path=classpath:/keys/public.pem
yuktisetu.jwt.issuer=auth-service

# Everything scheduled or brokered is OFF: tests drive the code directly so a
# background sweep cannot race the assertions.
yuktisetu.drive.sealing.enabled=false
yuktisetu.kafka.enabled=false
management.health.redis.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=YuktiSetu@2026
spring.data.redis.timeout=2000ms
